# iris runtime configuration. Every operational value is overridable by an
# environment variable via a Typesafe Config ${?ENV_VAR} substitution. No secrets
# are committed here.

iris {
  http {
    host = "0.0.0.0"
    host = ${?HTTP_HOST}
    port = 8080
    port = ${?HTTP_PORT}
  }

  vault {
    # The vault mirror the obsidian-sync sidecar pulls into (mounted read-only in
    # the cluster). Local dev points this at the real vault — which is safe,
    # because phase 1 never opens a file for writing:
    #   IRIS_VAULT_ROOT=$HOME/Mindmap
    root = "/vault"
    root = ${?IRIS_VAULT_ROOT}
  }

  db {
    # The rebuildable read model. Provisioned by the codex pg-service chart in
    # the cluster; locally: docker run -e POSTGRES_PASSWORD=iris -e POSTGRES_USER=iris \
    #   -e POSTGRES_DB=iris -p 5432:5432 postgres:16
    host = "localhost"
    host = ${?IRIS_DB_HOST}

    port = 5432
    port = ${?IRIS_DB_PORT}

    database = "iris"
    database = ${?IRIS_DB_NAME}

    user = "iris"
    user = ${?IRIS_DB_USER}

    password = "iris"
    password = ${?IRIS_DB_PASSWORD}

    # How long boot waits for the database before giving up (sidecar-ordering slack).
    migrate-max-wait = 60s
    migrate-max-wait = ${?IRIS_DB_MIGRATE_MAX_WAIT}
  }

  hermes {
    # OFF until the vault.proto contract lands in the-lexicon and the HermesMQ
    # session provisions the vault.note.* topics. When enabled (before the real
    # gRPC client exists) events are LOGGED in their wire shape, not sent.
    enabled = false
    enabled = ${?IRIS_HERMES_ENABLED}
  }

  scan {
    # Live file watching (inotify on the Linux PVC; polling on macOS dev).
    watch-enabled = true
    watch-enabled = ${?IRIS_WATCH_ENABLED}

    # Obsidian Sync touches files repeatedly mid-sync; events are batched per
    # path inside this window before reconciling.
    debounce = 2s
    debounce = ${?IRIS_WATCH_DEBOUNCE}

    # The STANDING safety net for missed watch events — not an interim patch.
    # WatchService has an inherent directory-registration race: when many files
    # land at once it silently drops events (no error, no OVERFLOW), so the index
    # can be short with no symptom. The quiesce gate below closes the first-boot
    # instance; this rescan is the only thing that heals the general case (a Sync
    # backlog, a vault restructure, a PVC/mirror rebuild). Its cost is ~nil: a
    # stat-per-file walk, ~0.5s for the full vault, hashing skipped for unchanged
    # files. Do NOT relax past 1h — 6h is a long window for a wrong-but-plausible
    # answer. Also the primary mechanism if the vault volume ever lands on a
    # filesystem where inotify does not fire.
    rescan-interval = 30m
    rescan-interval = ${?IRIS_RESCAN_INTERVAL}

    # Boot ordering: hold the initial scan until the mirror stops growing. On a
    # fresh deploy the sidecar downloads ~5,900 files while Iris is already up —
    # scanning immediately indexes a near-empty mirror and registers the watcher
    # against a tree still being written. Readiness does not wait on this; queries
    # serve the prior index throughout. Fails OPEN: if the mirror is still moving
    # at max-wait, scan anyway and let the rescan heal.
    quiesce {
      enabled = true
      enabled = ${?IRIS_QUIESCE_ENABLED}

      poll-interval = 5s
      poll-interval = ${?IRIS_QUIESCE_POLL_INTERVAL}

      # Consecutive unchanged polls required before the tree counts as settled
      # (3 x 5s => ~15s of quiet). An empty tree never counts as settled.
      stable-samples = 3
      stable-samples = ${?IRIS_QUIESCE_STABLE_SAMPLES}

      max-wait = 15m
      max-wait = ${?IRIS_QUIESCE_MAX_WAIT}
    }
  }
}
