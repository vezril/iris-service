# iris runtime configuration. Every operational value is overridable by an
# environment variable via a Typesafe Config ${?ENV_VAR} substitution. No secrets
# are committed here.

iris {
  http {
    host = "0.0.0.0"
    host = ${?HTTP_HOST}
    port = 8080
    port = ${?HTTP_PORT}
  }

  vault {
    # The vault mirror the obsidian-sync sidecar pulls into (mounted read-only in
    # the cluster). Local dev points this at the real vault — which is safe,
    # because phase 1 never opens a file for writing:
    #   IRIS_VAULT_ROOT=$HOME/Mindmap
    root = "/vault"
    root = ${?IRIS_VAULT_ROOT}
  }

  db {
    # The rebuildable read model. Provisioned by the codex pg-service chart in
    # the cluster; locally: docker run -e POSTGRES_PASSWORD=iris -e POSTGRES_USER=iris \
    #   -e POSTGRES_DB=iris -p 5432:5432 postgres:16
    host = "localhost"
    host = ${?IRIS_DB_HOST}

    port = 5432
    port = ${?IRIS_DB_PORT}

    database = "iris"
    database = ${?IRIS_DB_NAME}

    user = "iris"
    user = ${?IRIS_DB_USER}

    password = "iris"
    password = ${?IRIS_DB_PASSWORD}

    # How long boot waits for the database before giving up (sidecar-ordering slack).
    migrate-max-wait = 60s
    migrate-max-wait = ${?IRIS_DB_MIGRATE_MAX_WAIT}
  }

  scan {
    # Live file watching (inotify on the Linux PVC; polling on macOS dev).
    watch-enabled = true
    watch-enabled = ${?IRIS_WATCH_ENABLED}

    # Obsidian Sync touches files repeatedly mid-sync; events are batched per
    # path inside this window before reconciling.
    debounce = 2s
    debounce = ${?IRIS_WATCH_DEBOUNCE}

    # The safety net for missed watch events (and the primary mechanism if the
    # vault volume ever lands on a filesystem where inotify does not fire).
    rescan-interval = 6h
    rescan-interval = ${?IRIS_RESCAN_INTERVAL}
  }
}
